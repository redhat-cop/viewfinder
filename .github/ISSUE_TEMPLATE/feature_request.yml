name: Feature Request
description: Suggest a new feature or enhancement for Viewfinder
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide details below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What need does it address?
      placeholder: "Example: As a security auditor, I need to compare assessment results over time to track improvement"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as detailed as possible.
      placeholder: |
        Example:
        - Add a "Compare Results" feature in the navigation
        - Allow users to upload multiple exported assessment JSON files
        - Display side-by-side comparison with radar charts
        - Highlight improvements and regressions between assessments
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of Viewfinder does this relate to?
      options:
        - Assessment Profiles
        - User Interface
        - Reporting/Export
        - Data Visualization
        - Profile Management
        - Integration/API
        - Documentation
        - Security
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?
      placeholder: "Example: I considered manually comparing PDFs, but that's time-consuming and error-prone"

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who would benefit from this feature and how?
      placeholder: |
        Example:
        - Auditors can track progress over quarters
        - Management can see ROI on security investments
        - Organizations can validate improvement initiatives
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (Your Opinion)
      description: How important is this feature to you?
      options:
        - Critical (Blocking my use of Viewfinder)
        - High (Would significantly improve my workflow)
        - Medium (Nice to have)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Examples
      description: |
        If you have mockups, wireframes, or examples from other tools, please share them here.
        You can drag and drop images directly into this field.

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: |
        (Optional) If you have technical ideas about how this could be implemented, share them here.
        Are you willing to contribute code for this feature?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
          required: false
        - label: I can provide testing/feedback during development
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing feature requests to avoid duplicates
          required: true
        - label: This feature aligns with Viewfinder's purpose as a maturity assessment tool
          required: true
