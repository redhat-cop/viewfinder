<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ee0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer shield -->
  <path d="M 16,4 L 28,10 L 28,18 Q 28,28 16,30 Q 4,28 4,18 L 4,10 Z"
        fill="url(#shieldGradient)" stroke="#990000" stroke-width="0.5"/>
  <!-- Inner shield -->
  <path d="M 16,10 L 22,13 L 22,18 Q 22,23 16,25 Q 10,23 10,18 L 10,13 Z"
        fill="#ffffff" opacity="0.9"/>
  <!-- Checkmark for sovereignty compliance -->
  <path d="M 14,17 L 15.5,19 L 18.5,15"
        stroke="#ee0000" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
</svg>
